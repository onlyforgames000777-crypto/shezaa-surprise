<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise for Syeda Sheza</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Georgia, serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(
135deg,
#fff8f0,
#fadadd,
#ffe8b6,
#f5c6c6
);
position:relative;
}

/* Floating Hearts */

.heart{
position:absolute;
font-size:24px;
opacity:.6;
animation:float 12s linear infinite;
}

@keyframes float{
from{
transform:translateY(100vh);
}
to{
transform:translateY(-150px);
}
}

/* Sparkles */

.sparkle{
position:absolute;
font-size:16px;
animation:twinkle 3s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.3;}
50%{opacity:1;}
}

/* Main Card */

.card{
width:90%;
max-width:700px;
padding:40px;
border-radius:35px;
background:rgba(255,255,255,.65);
backdrop-filter:blur(15px);
text-align:center;
box-shadow:
0 0 40px rgba(255,215,0,.3);
border:3px solid rgba(255,215,0,.35);
z-index:10;
}

h1{
font-size:2.1rem;
color:#7a3e48;
margin-bottom:15px;
}

.subtitle{
font-size:1rem;
line-height:1.8;
color:#5a4a4a;
margin-bottom:25px;
}

.pinbox{
width:240px;
height:58px;
border:none;
border-radius:18px;
font-size:24px;
text-align:center;
background:white;
outline:none;
box-shadow:0 0 20px rgba(255,192,203,.5);
}

button{
margin-top:18px;
padding:15px 30px;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
cursor:pointer;
background:#ffcad4;
}

button:hover{
transform:scale(1.05);
}

.topdecor{
font-size:30px;
margin-bottom:15px;
}

.bottomdecor{
margin-top:25px;
font-size:28px;
}

.leftbear{
position:absolute;
left:20px;
bottom:20px;
font-size:65px;
}

.rightbear{
position:absolute;
right:20px;
bottom:20px;
font-size:65px;
}

.corner1{
position:absolute;
top:20px;
left:20px;
font-size:35px;
}

.corner2{
position:absolute;
top:20px;
right:20px;
font-size:35px;
}

</style>
</head>

<body>

<div class="corner1">🌹✨</div>
<div class="corner2">✨🌹</div>

<div class="leftbear">🧸</div>
<div class="rightbear">🧸</div>

<div class="card">

<div class="topdecor">
💌 🌸 ✨ 🌸 💌
</div>

<h1>
A Letter Waiting To Be Opened 💌
</h1>

<p class="subtitle">

For Syeda Shezaa 🥺🫶🏻🩵💫🪄🥹

<br><br>

Some memories are too precious to be written in ordinary places...

This little surprise is waiting patiently for you ✨🌸

<br><br>

The key is hidden in a date that changed everything 🥺💖

</p>

<input
type="password"
id="pin"
class="pinbox"
maxlength="6"
inputmode="numeric"
autocomplete="off"
placeholder="Enter Password 🔐">

<br>

<button onclick="checkPin()">
✨ Open My Surprise ✨
</button>

<div class="bottomdecor">
🌹 💖 🌸 ✨ 🌸 💖 🌹
</div>

</div>

<script>

for(let i=0;i<30;i++){

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="💖";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=
(8+Math.random()*8)+"s";

document.body.appendChild(heart);

}

for(let i=0;i<40;i++){

let sparkle=document.createElement("div");

sparkle.className="sparkle";
sparkle.innerHTML="✨";

sparkle.style.left=Math.random()*100+"vw";
sparkle.style.top=Math.random()*100+"vh";

document.body.appendChild(sparkle);

}

function checkPin(){

let pin=document.getElementById("pin").value;

if(pin==="261125"){

window.location.href="garden.html";

}

else{

alert("Wrong Password 🥺");

}

}

</script>

</body>
</html>
